  <text x="330" y="218" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC">idempotency</text>
  <text x="330" y="260" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">Reliable request deduplication for Laravel applications</text>
