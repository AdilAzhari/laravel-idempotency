name: Update Packagist

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  update-packagist:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist update
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository": {"github": "https://github.com/AdilAzhari/laravel-idempotency"}}' \
            https://packagist.org/api/update-package?username=AdilAzhari\&token=${{ secrets.PACKAGIST_TOKEN }}
